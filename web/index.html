<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent1 Omni — beats every other agent ($0)</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #0b1020; color: #e8ecf4; margin: 0; }
  header { padding: 18px 22px; background: linear-gradient(90deg,#1b2452,#0e3b3b); }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; color: #9fb0d0; font-size: 13px; }
  main { max-width: 860px; margin: 0 auto; padding: 18px; }
  #chat { min-height: 50vh; border: 1px solid #2a3560; border-radius: 12px; padding: 14px;
          background: #111834; white-space: pre-wrap; }
  .msg { margin: 10px 0; padding: 10px 12px; border-radius: 10px; line-height: 1.5; }
  .user { background: #1e2c5e; } .bot { background: #16202e; border: 1px solid #24334d; }
  .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  select, input[type=text] { background: #0f1730; color: #e8ecf4; border: 1px solid #2a3560;
    border-radius: 8px; padding: 10px; }
  input[type=text] { flex: 1; min-width: 220px; }
  button { background: #3b82f6; color: white; border: 0; border-radius: 8px;
    padding: 10px 18px; cursor: pointer; font-weight: 600; }
  button:disabled { opacity: .5; }
  #models { font-size: 12px; color: #9fb0d0; margin-top: 10px; }
</style>
</head>
<body>
<header>
  <h1>🤖 Agent1 Omni</h1>
  <p>Single agent + crew + coder + researcher — free OpenRouter models, $0 forever</p>
</header>
<main>
  <div id="chat"><div class="msg bot">Ask anything, or give me an autonomous task (toggle Task mode). I plan, use tools, verify, and reflect — like OpenHands + CrewAI + AutoGPT combined, but free.</div></div>
  <div class="row">
    <select id="kind">
      <option value="general">General</option>
      <option value="code">Code</option>
      <option value="research">Research</option>
    </select>
    <select id="crew">
      <option value="">Single agent</option>
      <option value="sequential">Crew: sequential</option>
      <option value="hierarchical">Crew: hierarchical</option>
      <option value="debate">Crew: debate</option>
    </select>
    <label style="font-size:13px;color:#9fb0d0"><input type="checkbox" id="taskmode"> Autonomous task</label>
  </div>
  <div class="row">
    <input type="text" id="inp" placeholder="Message or task…" onkeydown="if(event.key==='Enter')send()">
    <button id="btn" onclick="send()">Send</button>
  </div>
  <div id="models">loading free models…</div>
</main>
<script>
const chat = document.getElementById('chat');
function add(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
}
async function send() {
  const inp = document.getElementById('inp'), btn = document.getElementById('btn');
  const text = inp.value.trim(); if (!text) return;
  inp.value = ''; btn.disabled = true; add(text, 'user');
  const taskmode = document.getElementById('taskmode').checked;
  const crew = document.getElementById('crew').value;
  const mode = document.getElementById('kind').value;
  add('…thinking (free models, may take a few seconds)…', 'bot');
  try {
    const url = (taskmode || crew) ? '/api/task' : '/api/chat';
    const body = (taskmode || crew)
      ? { task: text, mode, crew } : { message: text, mode };
    const r = await fetch(url, { method: 'POST',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json();
    chat.lastChild.textContent = j.reply || j.error || '(empty)';
  } catch (e) { chat.lastChild.textContent = 'Error: ' + e; }
  btn.disabled = false;
}
fetch('/api/models').then(r => r.json()).then(j => {
  document.getElementById('models').textContent =
    'Free cascade: ' + (j.cascade || []).slice(0, 6).join('  →  ') + '  … (+ auto-discovery)';
});
</script>
</body>
</html>
